      - op: advance_clock
        to: "2026-03-15"
    questions:
      - ask: who is the acting atlas release manager
        disposition: unknown
        not_current: [Priya]
        evidence: [projects/atlas-acting-release-manager]

  - id: future-effective-notyet-pos
    family: future_effective
    control: positive
    project: atlas
    before:
      at: 1
      ask: what is the atlas API rate limit
      answer: 100 requests per minute
    events:
      - op: save
        ref: decisions/atlas-ratelimit-v1
        title: Atlas API rate limit
        type: Decision
        date: "2026-01-20"
        fm: {entities: [project/atlas], status: active}
        body: The atlas API rate limit is 100 requests per minute.
      - op: save
        ref: decisions/atlas-ratelimit-v2
        title: Atlas API rate limit from June
        type: Decision
        date: "2026-06-01"
        fm: {entities: [project/atlas], status: active}
        body: The atlas API rate limit is 500 requests per minute.
      - op: supersede_record
        ref: decisions/atlas-ratelimit-v1
        by: decisions/atlas-ratelimit-v2
        reason: raised from June
      - op: advance_clock
        to: "2026-03-01"
    questions:
      - ask: what is the atlas API rate limit
        disposition: current
        answer: 100 requests per minute
        not_current: [500 requests per minute]
        evidence: [decisions/atlas-ratelimit-v2]
        note: >-
          The design's required result is that the old value remains applicable
          until the transition. The executor still retires the predecessor the
          moment the replacement is written; the resolution policy now reads a
          successor dated forward as a scheduled change and keeps the
          predecessor standing until that date (`replacement_scheduled`,
          carrying `superseded_from:`). The 2026-09-12 acceptance run predates
          that and scored this episode as a refusal.

  - id: future-effective-neg
    family: future_effective
    control: negative
    project: beacon
    events:
