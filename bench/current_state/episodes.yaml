# Current-state acceptance corpus — authored (dev) split.
#
# Every scenario family in the design carries a positive control (the
# transition happened) and a negative control (structurally the same, nothing
# changed). The held-out split is DERIVED from this file at load time by
# project substitution and question paraphrase under a fixed seed — do not
# author held-out episodes here, and do not use a held-out project name.
#
# Oracles state the REQUIRED result, not the observed one. Where the shipped
# policy deliberately declines to produce the required result, the question
# carries a `note:` and the report keeps the failure.
corpus_version: 1

episodes:

  # ── 1. Explicit A → B replacement ────────────────────────────────────────
  - id: explicit-replacement-pos
    family: explicit_replacement
    control: positive
    project: atlas
    tags: [mechanical, release_fixture]
    before:
      at: 1
      ask: which cache backend does atlas use
      answer: Memcached
    events:
      - op: save
        ref: projects/atlas-status
        title: Atlas cache status
        type: ProjectSnapshot
        date: "2026-01-10"
        fm: {entities: [project/atlas], status: active}
        body: |
          - [2026-01-10] The atlas cache backend is Memcached. <!-- fact:atlas-cache -->
          - [2026-01-10] The atlas cache eviction policy is allkeys-lru. <!-- fact:atlas-evict -->
      - op: save
        ref: daily/2026-02-14-atlas-cache
        title: Atlas cache session
        type: Insight
        date: "2026-02-14"
        fm: {entities: [project/atlas]}
        body: Session notes for atlas. The cache backend was moved to Redis this week.
      - op: consolidate
        pass: nightly
        ops:
          - op: SUPERSEDE
            id: atlas-cache
            new_text: "[2026-02-14] The atlas cache backend is Redis."
            rationale: replaced in the February session
    questions:
      - ask: which cache backend does atlas use
        disposition: current
        answer: Redis
        not_current: [Memcached]
        evidence: [projects/atlas-status]

  - id: explicit-replacement-neg
    family: explicit_replacement
    control: negative
    project: atlas
    before:
      at: 1
      ask: which queue backend does atlas use
      answer: RabbitMQ
    events:
      - op: save
        ref: decisions/atlas-queue
        title: Atlas queue backend
        type: Decision
        date: "2026-01-12"
        fm: {entities: [project/atlas], status: active}
        body: The atlas queue backend is RabbitMQ for every environment.
      - op: save
        ref: insights/atlas-queue-review
        title: Atlas queue review
        type: Insight
        date: "2026-03-04"
        fm: {entities: [project/atlas]}
        body: The atlas queue backend was reviewed this quarter and left unchanged.
    questions:
      - ask: which queue backend does atlas use
        disposition: current
        answer: RabbitMQ
        not_current: [Kafka]
        evidence: [decisions/atlas-queue]

